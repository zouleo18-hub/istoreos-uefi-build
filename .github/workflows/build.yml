name: Build iStoreOS x86_64 UEFI (OpenClash+PassWall)
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build.yml', 'config.fragment', 'feeds.conf']
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with: { tool-cache: true, android: true, dotnet: true, haskell: true, large-packages: true, swap-storage: true }
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison gawk gettext git libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget xsltproc squashfs-tools
          sudo update-alternatives --set awk /usr/bin/gawk || true
      - name: ccache cache
        uses: hendrikmuhs/ccache-action@v1.2
        with: { key: istoreos-24.10-x86_64 }
      - name: Checkout builder repo
        uses: actions/checkout@v4
        with: { path: builder }
      - name: Clone iStoreOS 24.10
        run: git clone --depth 1 -b istoreos-24.10 https://github.com/istoreos/istoreos.git openwrt
      - name: Feeds + OpenClash
        working-directory: openwrt
        run: |
          cp ../builder/feeds.conf feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          git clone --depth 1 https://github.com/vernesong/OpenClash.git package/openclash-src
          ls feeds/passwall/luci-app-passwall package/openclash-src/luci-app-openclash
      - name: Config (UEFI only, BIOS off) + overlay files
        working-directory: openwrt
        run: |
          curl -sL -o .config https://fw.koolcenter.com/iStoreOS/x86_64_efi/config.seed
          cat ../builder/config.fragment >> .config
          mkdir -p files/etc/uci-defaults files/etc/openclash/rules files/etc/openclash/custom files/etc/passwall/rules
          cat > files/etc/uci-defaults/99-leo-uefi-custom <<'EOS'
          #!/bin/sh
          uci set luci.main.lang=zh_cn 2>/dev/null; uci commit luci 2>/dev/null
          uci set openclash.config.enable=0 2>/dev/null; uci commit openclash 2>/dev/null
          uci set passwall.@global[0].enabled=0 2>/dev/null; uci commit passwall 2>/dev/null
          exit 0
          EOS
          chmod +x files/etc/uci-defaults/99-leo-uefi-custom
          printf 'rule-providers: {}\nrules: []\n' > files/etc/openclash/custom/custom.yaml
          cat > files/etc/openclash/rules/finance-hk.yaml <<'REOF'
          payload:
            - DOMAIN-SUFFIX,hsbc.com.hk
            - DOMAIN-SUFFIX,hangseng.com
            - DOMAIN-SUFFIX,bochk.com
            - DOMAIN-SUFFIX,sc.com
            - DOMAIN-SUFFIX,hkex.com.hk
            - DOMAIN-SUFFIX,sfc.hk
            - DOMAIN-SUFFIX,hkma.gov.hk
          REOF
          cat > files/etc/openclash/rules/finance-cn.yaml <<'REOF'
          payload:
            - DOMAIN-SUFFIX,icbc.com.cn
            - DOMAIN-SUFFIX,ccb.com
            - DOMAIN-SUFFIX,abchina.com
            - DOMAIN-SUFFIX,boc.cn
            - DOMAIN-SUFFIX,bankcomm.com
            - DOMAIN-SUFFIX,alipay.com
            - DOMAIN-SUFFIX,tenpay.com
            - DOMAIN-SUFFIX,unionpay.com
          REOF
          cat > files/etc/openclash/rules/ai.yaml <<'REOF'
          payload:
            - DOMAIN-SUFFIX,openai.com
            - DOMAIN-SUFFIX,chatgpt.com
            - DOMAIN-SUFFIX,claude.ai
            - DOMAIN-SUFFIX,anthropic.com
            - DOMAIN-SUFFIX,gemini.google.com
            - DOMAIN-SUFFIX,perplexity.ai
            - DOMAIN-SUFFIX,huggingface.co
          REOF
          cat > files/etc/openclash/rules/dev.yaml <<'REOF'
          payload:
            - DOMAIN-SUFFIX,github.com
            - DOMAIN-SUFFIX,githubusercontent.com
            - DOMAIN-SUFFIX,gitlab.com
            - DOMAIN-SUFFIX,docker.com
            - DOMAIN-SUFFIX,docker.io
            - DOMAIN-SUFFIX,npmjs.org
            - DOMAIN-SUFFIX,pypi.org
            - DOMAIN-SUFFIX,pythonhosted.org
          REOF
          sed -i 's/--enable-tui --disable-gdbtk/--disable-tui --disable-gdbtk/' toolchain/gdb/Makefile
          make defconfig
          sed -i 's/^CONFIG_GRUB_IMAGES=y/# CONFIG_GRUB_IMAGES is not set/' .config
          make defconfig
          grep -E '^CONFIG_TARGET_x86_64=|^CONFIG_PACKAGE_luci-app-openclash=|^CONFIG_PACKAGE_luci-app-passwall=' .config
          grep -E 'GRUB_IMAGES|GRUB_EFI' .config
      - name: Download sources
        working-directory: openwrt
        run: make download -j$(nproc) || make download -j1 V=s
      - name: Compile
        working-directory: openwrt
        run: |
          make -j$(nproc)
          ls -lh bin/targets/x86/64/
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-failed-run
          path: openwrt/logs/
          retention-days: 7
      - name: Audit GPT/EFI + SHA256
        working-directory: openwrt
        run: |
          IMG=$(ls bin/targets/x86/64/*combined-efi.img.gz | head -1); echo "IMG=$IMG"
          gzip -dc "$IMG" > /tmp/fw.img
          python3 -c "import sys; f=open('/tmp/fw.img','rb'); m=f.read(512); assert m[510:]==b'\x55\xaa'; print('protectiveMBR_ee:', m[450]==0xEE); f.seek(512); print('GPT_EFI_PART:', f.read(8)==b'EFI PART')"
          sha256sum bin/targets/x86/64/*combined-efi.img.gz
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: istoreos-x86_64-uefi-openclash-passwall
          path: |
            openwrt/bin/targets/x86/64/*combined-efi.img.gz
            openwrt/bin/targets/x86/64/*.manifest
            openwrt/bin/targets/x86/64/config.buildinfo
          retention-days: 14
